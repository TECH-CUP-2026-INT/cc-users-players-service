name: CI - Build, Test, Publish & Deploy

on:
  push:
    branches: [ 'feat/**', 'develop', 'main', 'qa' ]
  pull_request:
    branches: [ 'develop' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn clean verify -B
        env:
          IDENTITY_SERVICE_URL: http://localhost:8081
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
          retention-days: 1

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
      - uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=tech-cup-2026-int
            -Dsonar.projectKey=TECH-CUP-2026-INT_cc-users-players-service
            -Dsonar.projectName=cc-users-players-service
            -Dsonar.java.source=21
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  dockerize-publish:
    name: Build & Push Docker Image
    needs: build-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn clean package -DskipTests -B
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=qa,enable=${{ github.ref == 'refs/heads/qa' }}
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Azure
    needs: dockerize-publish
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    steps:
      - name: Set target per branch
        id: target
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            echo "APP_NAME=${{ secrets.AZURE_WEBAPP_QA_NAME }}" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=qa" >> $GITHUB_OUTPUT
          else
            echo "APP_NAME=${{ secrets.AZURE_WEBAPP_NAME }}" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=latest" >> $GITHUB_OUTPUT
          fi
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.target.outputs.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.target.outputs.IMAGE_TAG }}
