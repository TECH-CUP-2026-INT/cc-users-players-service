server:
  port: ${SERVER_PORT:8084}
  servlet:
    context-path: /api/v1

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/techcup}
      database: techcup
      uuid-representation: standard
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  security:
    bcrypt-strength: 10
  otp:
    expiration-minutes: 15
    max-attempts: 3
  allowed-domains: "@mail.escuelaing.edu.co"

identity:
  service:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}

teams:
  service:
    base-url: ${TEAMS_SERVICE_URL:http://localhost:8082}
